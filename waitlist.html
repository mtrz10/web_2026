<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Anggara Treasures</title>
    <meta name="description"
        content="Anggara Treasures segera hadir — konsultasi Imperial Feng Shui & BaZi, serta koleksi Jadeite pilihan. Hubungi kami melalui WhatsApp.">
    <link rel="icon" href="img/logo.png">

    <style>
        :root {
            --color-primary: #9c0512;
            --color-secondary: #ffffff;
            --color-font: #171817;

            --font-heading: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            color: var(--color-font);
            line-height: 1.6;
            overflow: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .cs-hero {
            position: relative;
            height: 100vh;
            min-height: 640px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            text-align: left;
            background: linear-gradient(90deg, rgba(10, 2, 3, 0.8) 0%, rgba(10, 2, 3, 0.7) 38%, rgba(10, 2, 3, 0.4) 55%, rgba(10, 2, 3, 0) 65%),
                url('img/wait_bnr.jpeg') center/cover no-repeat;
            color: var(--color-secondary);
        }

        .cs-inner {
            max-width: 560px;
            padding: 0 24px 0 60px;
            opacity: 0;
            animation: cs-fade-in 1.4s ease 0.2s forwards;
        }

        @keyframes cs-fade-in {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cs-eyebrow {
            font-size: 0.72rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 5px;
            opacity: 0.85;
            margin-bottom: 22px;
        }

        .cs-title {
            font-family: var(--font-heading);
            font-weight: 300;
            font-size: 4rem;
            line-height: 1.1;
            letter-spacing: 0.5px;
            color: #EFEACD;
            margin-bottom: 26px;
        }

        .cs-rule {
            width: 56px;
            height: 1px;
            background: rgba(255, 255, 255, 0.5);
            margin: 0 0 26px;
        }

        .cs-sub {
            font-size: 1.2rem;
            font-weight: 300;
            opacity: 0.9;
            max-width: 480px;
            margin: 0 0 42px;
        }

        .cs-cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 34px;
            border: 1px solid rgba(255, 255, 255, 0.75);
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            transition: background-color 0.35s ease, color 0.35s ease;
        }

        .cs-cta:hover {
            background-color: var(--color-secondary);
            color: var(--color-font);
        }

        @media (max-width: 768px) {
            .cs-hero {
                background-attachment: scroll;
            }

            .cs-inner {
                max-width: 100%;
                padding: 0 24px;
            }

            .cs-title {
                font-size: 2.6rem;
            }
        }
    </style>
</head>

<body>

    <section class="cs-hero">
        <div class="cs-inner">
            <p class="cs-eyebrow">Anggara Treasures</p>
            <h1 class="cs-title">Coming Soon</h1>
            <div class="cs-rule"></div>
            <p class="cs-sub">Konsultasi Imperial Feng Shui &amp; BaZi, serta koleksi Jadeite pilihan, akan
                segera hadir. Hubungi kami melalui WhatsApp untuk informasi lebih awal.</p>
            <a class="cs-cta"
                href="https://wa.me/628161685099?text=Halo%20Anggara%20Treasures%2C%20saya%20ingin%20mengetahui%20informasi%20lebih%20lanjut."
                target="_blank" rel="noopener">Hubungi via WhatsApp &rarr;</a>
        </div>
    </section>

</body>

</html>
